spring:
  application:
    name: msa1
  profiles:
    active: dev
  config:
    import: optional:configserver:http://admin:1234@localhost:9000
eureka:
  client:
    fetch-registry: true        # eureka 서버에서 정보를 가져옴
    register-with-eureka: true  # eureka 서버에 등록
    service-url:
      defaultZone: http://admin:1234@localhost:8761/eureka/
